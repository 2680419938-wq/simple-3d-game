<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>简单3d游戏 · three.js 第三人称验证</title>
<style>
  html,body{margin:0;height:100%;background:#0d1015;overflow:hidden;font:13px/1.5 -apple-system,"Segoe UI",sans-serif;color:#dfe6f2}
  canvas{display:block}
  #hud{position:fixed;left:16px;top:14px;max-width:calc(100vw - 32px);pointer-events:none;text-shadow:0 1px 3px #000}
  #cliplist{font-size:12px}
  #hud b{font-size:15px;letter-spacing:.5px}
  #hud .k{color:#8fa3bf}
  #stats{position:fixed;right:16px;top:14px;text-align:right;color:#8fa3bf;font-variant-numeric:tabular-nums}
  #loading{position:fixed;inset:0;display:grid;place-items:center;color:#8fa3bf}
  #game{position:fixed;left:50%;top:12px;transform:translateX(-50%);font-size:15px;letter-spacing:.4px;color:#9fe6ff;text-shadow:0 1px 4px #000;pointer-events:none;font-variant-numeric:tabular-nums}
  #game.win{color:#8dffa8;font-size:18px}
  #dbg{position:fixed;left:12px;bottom:10px;font-size:12px;line-height:1.45;color:#7fd4ff;white-space:pre;text-shadow:0 1px 3px #000;pointer-events:none;opacity:.9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <b>简单3d游戏 · <span id="lodname">LOD0</span></b><br />
  <span class="k" id="cliplist"></span><br />
  <span class="k">WASD 移动 · 鼠标左键拖拽转视角 · 滚轮缩放</span><br />
  <span class="k" id="state"></span>
</div>
<div id="stats"></div>
<div id="game"></div>
<div id="dbg"></div>
<div id="loading">loading model …</div>
<script>
  // Runs before the module script: under file:// the ES module is blocked by CORS,
  // so this guard has to be a classic inline script or it never executes.
  if (location.protocol === 'file:') {
    document.getElementById('loading').innerHTML =
      '<div style="text-align:center;line-height:1.9">' +
      '<b style="font-size:16px">需要用 HTTP 打开，不能双击 index.html</b><br>' +
      '浏览器在 file:// 下会拦截 ES 模块和 .glb 的读取，所以页面会一直停在 loading。<br><br>' +
      '在 <code>web-preview</code> 目录执行 <code>pnpm dev</code>，然后访问<br>' +
      '<a style="color:#7ea6ff;font-size:15px" href="http://localhost:5199/">http://localhost:5199/</a>' +
      '</div>';
  }
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
