<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>简单3d游戏 · three.js 第三人称验证</title>
<style>
  html,body{margin:0;height:100%;background:#0d1015;overflow:hidden;font:13px/1.5 -apple-system,"Segoe UI",sans-serif;color:#dfe6f2}
  canvas{display:block}
  #hud{position:fixed;left:16px;top:14px;max-width:calc(100vw - 32px);pointer-events:none;text-shadow:0 1px 3px #000}
  #cliplist{font-size:12px}
  #hud b{font-size:15px;letter-spacing:.5px}
  #hud .k{color:#8fa3bf}
  #stats{position:fixed;right:16px;top:14px;text-align:right;color:#8fa3bf;font-variant-numeric:tabular-nums}
  #loading{position:fixed;inset:0;display:grid;place-items:center;color:#8fa3bf}
  #game{position:fixed;left:50%;top:12px;transform:translateX(-50%);font-size:15px;letter-spacing:.4px;color:#9fe6ff;text-shadow:0 1px 4px #000;pointer-events:none;font-variant-numeric:tabular-nums}
  #game.win{color:#8dffa8;font-size:18px}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 42%, rgba(8,12,16,0.34) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen}

  #cards{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:rgba(6,10,16,.62);z-index:20}
  #cards.show{display:flex}
  #cardtag{font-size:13px;letter-spacing:2px;color:#9fe6ff;text-shadow:0 1px 4px #000}
  #cardrow{display:flex;gap:14px}
  #cards .card{position:relative;width:210px;min-height:158px;padding:16px 14px;border-radius:10px;border:1px solid #3a4a60;background:linear-gradient(160deg,rgba(28,40,58,.96),rgba(14,20,30,.96));color:#dfe9f5;font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .12s,border-color .12s,box-shadow .12s}
  #cards .card:hover{transform:translateY(-3px);border-color:#5fd0ff;box-shadow:0 0 18px rgba(95,208,255,.35)}
  #cards .card b{font-size:15px;color:#fff}
  #cards .card i{font-style:normal;font-size:12px;line-height:1.5;color:#9fb2c8}
  #cards .card .n{position:absolute;right:11px;top:9px;font-size:11px;color:#6d819b}
  #dbg{position:fixed;left:12px;bottom:10px;font-size:12px;line-height:1.45;color:#7fd4ff;white-space:pre;text-shadow:0 1px 3px #000;pointer-events:none;opacity:.9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <b>简单3d游戏 · <span id="lodname">LOD0</span></b><br />
  <span class="k" id="cliplist"></span><br />
  <span class="k">WASD 移动 · 鼠标左键拖拽转视角 · 滚轮缩放 · J 挥击 · 1–4 技能（升级解锁） · 升级时 1/2/3 选卡</span><br />
  <span class="k" id="state"></span>
</div>
<div id="stats"></div>
<div id="game"></div>
<div id="dbg"></div>
<div id="vig"></div>
<div id="flash"></div>
<div id="cards"><div id="cardtag"></div><div id="cardrow"></div></div>
<div id="loading">loading model …</div>
<script>
  // Runs before the module script: under file:// the ES module is blocked by CORS,
  // so this guard has to be a classic inline script or it never executes.
  if (location.protocol === 'file:') {
    document.getElementById('loading').innerHTML =
      '<div style="text-align:center;line-height:1.9">' +
      '<b style="font-size:16px">需要用 HTTP 打开，不能双击 index.html</b><br>' +
      '浏览器在 file:// 下会拦截 ES 模块和 .glb 的读取，所以页面会一直停在 loading。<br><br>' +
      '在 <code>web-preview</code> 目录执行 <code>pnpm dev</code>，然后访问<br>' +
      '<a style="color:#7ea6ff;font-size:15px" href="http://localhost:5199/">http://localhost:5199/</a>' +
      '</div>';
  }
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
